linters:
  disable-all: true
  enable:
    - durationcheck
    - errcheck
    - copyloopvar
    #- forcetypeassert (disable for now)
    - godot
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unused

linters-settings:
  goimports:
    local-prefixes:
      github.com/cloudsigma/cloudsigma-sdk-go
      github.com/cloudsigma/terraform-provider-cloudsigma

output:
  formats:
    - format: tab
  show-stats: true

issues:
  exclude-dirs:
    - build/offline

run:
  timeout: 10m
