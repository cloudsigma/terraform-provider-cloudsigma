name: Tests

on:
  workflow_dispatch:
    inputs:
      acceptance:
        description: Run dedicated TEST-account acceptance (creates resources)
        type: boolean
        default: false
        required: true
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
      - "README.md"
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "go.mod"

      - name: Build provider
        run: make build

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "go.mod"

      - name: Fix permissions for cache directories
        run: |
          chmod -R 0755 ~/.cache/go-build ~/go/pkg/mod || true

      - name: Set up cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install tools
        run: make tools

      - name: Lint source code
        run: make lint

      - name: Set up checksum-verified pinned Terraform CLI
        run: bash scripts/install-terraform-ci.sh

      - name: Run unit tests
        run: python3 scripts/offline.py

  acceptance-tests:
    # Fail closed until admission and durable receipt integration is reviewed.
    if: ${{ false }}
    environment: dedicated-test
    name: acceptance tests (terraform ${{ matrix.terraform-version }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      CLOUDSIGMA_USERNAME: ${{ secrets.CLOUDSIGMA_USERNAME }}
      CLOUDSIGMA_PASSWORD: ${{ secrets.CLOUDSIGMA_PASSWORD }}
      CLOUDSIGMA_LOCATION: ${{ secrets.CLOUDSIGMA_LOCATION }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        terraform-version:
          - "1.7.*"
          - "1.8.*"
          - "1.9.*"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ matrix.terraform-version }}
          terraform_wrapper: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "go.mod"

      - name: Fix permissions for cache directories
        run: |
          chmod -R 0755 ~/.cache/go-build ~/go/pkg/mod || true

      - name: Set up cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install tools
        run: make tools

      - name: Run acceptance tests
        timeout-minutes: 22
        run: timeout --signal=TERM --kill-after=30s 21m make testacc ACCEPTANCE_TIMEOUT=20m

  docs:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "go.mod"

      - name: Fix permissions for cache directories
        run: |
          chmod -R 0755 ~/.cache/go-build ~/go/pkg/mod || true

      - name: Set up cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install tools
        run: make tools

      - name: Set up checksum-verified pinned Terraform CLI
        run: bash scripts/install-terraform-ci.sh

      - name: Validate provider docs
        run: |
          make docs
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference after code generation. Run 'make docs' and commit."; exit 1)
